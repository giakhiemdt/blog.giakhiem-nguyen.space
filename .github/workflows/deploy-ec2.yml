name: Deploy blog to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blog-ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and smoke test on EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          set -eu
          test -n "$SSH_HOST"
          printf '%s\n' "Deploying $IMAGE"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "ec2-user@$SSH_HOST" \
            "bash -s -- '$IMAGE'" <<'REMOTE'
          set -euo pipefail
          image="$1"
          docker pull "$image"
          docker rm -f blog-candidate >/dev/null 2>&1 || true
          docker run -d --name blog-candidate \
            -p 127.0.0.1:8081:80 "$image"
          trap 'docker rm -f blog-candidate >/dev/null 2>&1 || true' EXIT
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:8081/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8081/ >/dev/null
          docker rm -f blog-candidate >/dev/null
          trap - EXIT

          # Remove the temporary manual test container if present.
          docker rm -f blog-test >/dev/null 2>&1 || true

          # Retain the previous production container for rollback.
          docker rm -f blog-previous >/dev/null 2>&1 || true
          if docker container inspect blog >/dev/null 2>&1; then
            docker stop blog >/dev/null
            docker rename blog blog-previous
          fi

          if docker run -d --name blog --restart unless-stopped \
            -p 127.0.0.1:8080:80 "$image" \
            && curl --retry 5 --retry-delay 2 --retry-connrefused \
              --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
            echo "Deployment successful: $image"
          else
            echo "Deployment failed; restoring previous container if available" >&2
            docker rm -f blog >/dev/null 2>&1 || true
            if docker container inspect blog-previous >/dev/null 2>&1; then
              docker rename blog-previous blog
              docker start blog >/dev/null
            fi
            exit 1
          fi
          REMOTE
